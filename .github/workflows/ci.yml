name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_check:
        description: Run Herdr's native mod checker on macOS (downloads current upstream release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Config and syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Python and shell availability
        run: |
          python3 --version
          bash --version | head -n 1
      - name: Validate configuration and mod manifests
        run: node scripts/check-config.mjs
      - name: Check JavaScript syntax
        run: |
          git ls-files -z -- '*.js' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Check Python and shell syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for name in subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py']).decode().split('\0'):
              if name:
                  compile(Path(name).read_bytes(), name, 'exec')
          PY
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Check generated Orca UI and shared helpers
        run: node scripts/build-orca-ui.mjs --check --out .
      - name: Run UI snapshot observer unit tests (no GUI)
        run: python3 -m unittest discover -s ui-snapshot -p 'test_*.py'
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code
      - name: Paired Git branch-header microbenchmark
        run: |
          python3 scripts/benchmark-git-status.py --output "$RUNNER_TEMP/git-status-benchmark.json"
          python3 - "$RUNNER_TEMP/git-status-benchmark.json" <<'PY'
          import json, sys, os
          d = json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Git branch-header microbenchmark (synthetic, not app latency)\n")
              f.write("| Metric | Before ms | After ms | Reduction |\n|---|---:|---:|---:|\n")
              for m in ("p50_ms", "p95_ms"):
                  f.write(f"| {m} | {d['before'][m]} | {d['after'][m]} | {d[m + '_reduction_pct']}% |\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: git-status-benchmark
          path: ${{ runner.temp }}/git-status-benchmark.json
          if-no-files-found: error

  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, behavior]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated herdr-app test stand-in
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$#" -eq 2 ] && [ "$1" = do ] && [ "$2" = orca-status.refresh ]; then echo "$@" >> "$RUNNER_TEMP/stub.log"; exit 0; fi\nexit 1\n' > "$RUNNER_TEMP/bin/herdr-app"
          chmod +x "$RUNNER_TEMP/bin/herdr-app"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run assigned test suite
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          export HOME="$(mktemp -d)" HERDR_APP_HOME="$(mktemp -d)"
          mapfile -d '' tests < <(git ls-files -z -- 'mods/*.test.js' 'mods/*.test.mjs' 'mods/*.test.cjs' 'scripts/*.test.js' 'scripts/*.test.mjs' 'scripts/*.test.cjs' 'orca-ui/features/*.test.js' 'orca-ui/features/*.test.mjs' 'orca-ui/features/*.test.cjs')
          selected=()
          for file in "${tests[@]}"; do
            case "$file" in
              *flow.test.*|*golden.test.*|*/render.test.*|*/git-refresh.test.*|*/interactions.test.*) suite=behavior ;;
              *) suite=unit ;;
            esac
            if [[ "$suite" == "$TEST_SUITE" ]]; then selected+=("$file"); fi
          done
          test "${#selected[@]}" -gt 0
          echo "Running ${#selected[@]} tracked test files ($TEST_SUITE)"
          node --test --test-timeout=60000 "${selected[@]}"
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code

  checks:
    name: Tests and config validation
    needs: [validate, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all suites and validation
        env:
          VALIDATION: ${{ needs.validate.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$VALIDATION" = success && test "$TESTS" = success

  package:
    name: Package validated config
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tracked installation files
        run: |
          git archive --format=zip --output=herdr-my-orca.zip HEAD layouts mods themes keys.json programs.json settings.json
          sha256sum herdr-my-orca.zip > herdr-my-orca.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-my-orca-${{ github.sha }}
          path: |
            herdr-my-orca.zip
            herdr-my-orca.zip.sha256
          if-no-files-found: error
          retention-days: 14

  native:
    name: Herdr native mod check (isolated)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.native_check)
    needs: checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install upstream Herdr app
        run: |
          test "$(uname -m)" = arm64
          curl --fail --silent --show-error --location --retry 3 https://releases.herdr.dev/app/install.sh -o "$RUNNER_TEMP/herdr-install.sh"
          sh "$RUNNER_TEMP/herdr-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate all mods in an isolated Herdr app home
        shell: bash
        run: |
          export HERDR_APP_HOME="$RUNNER_TEMP/herdr-ci-home"
          mkdir -p "$HERDR_APP_HOME"
          git archive HEAD | tar -x -C "$HERDR_APP_HOME"
          cd "$HERDR_APP_HOME"
          test "$(find mods -mindepth 2 -maxdepth 2 -name mod.json | wc -l | tr -d ' ')" -gt 0
          failed=0
          for manifest in "$HERDR_APP_HOME"/mods/*/mod.json; do
            mod="${manifest%/mod.json}"
            echo "::group::${mod##*/}"
            if ! herdr-app check "$mod"; then
              echo "::error::Native check failed for ${mod##*/}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

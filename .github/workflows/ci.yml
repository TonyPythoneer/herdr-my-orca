name: CI

# Native UI jobs are separate workflows that wait for this run's artifact (see native-ui-e2e.yml).
on:
  pull_request:
    branches: [main, ci/main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      # Formatting is not enforced: 14 src/test files and most mods/ copies are not formatted yet.
      - name: Lint and type checks (vp check --no-fmt)
        run: ./node_modules/.bin/vp check --no-fmt
      - name: Type-aware lint and type check (src, test)
        run: npm run check:ts
      - name: Validate configuration and mod manifests
        run: node scripts/check-config.mjs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      - name: Install isolated herdr-app test stand-in
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$#" -eq 2 ] && [ "$1" = do ] && [ "$2" = orca-status-bar.refresh ]; then echo "$@" >> "$RUNNER_TEMP/stub.log"; exit 0; fi\nexit 1\n' > "$RUNNER_TEMP/bin/herdr-app"
          chmod +x "$RUNNER_TEMP/bin/herdr-app"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Vitest suite with coverage (from source)
        run: |
          export HOME="$(mktemp -d)" HERDR_APP_HOME="$(mktemp -d)"
          ./node_modules/.bin/vp test run test --coverage
      - name: Python tests (no GUI, no LiteLLM install, no network)
        run: |
          python3 -m unittest discover -s ui-snapshot -p 'test_*.py'
          python3 -I scripts/litellm-remote-health-test.py
          python3 -I scripts/litellm-quickstart-test.py
          python3 -I scripts/benchmark-pages-test.py
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 90
      # Baseline = latest successful push to main. Missing baseline is reported, never fatal.
      - name: Fetch main coverage baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-summary -D "$RUNNER_TEMP/baseline"
      - name: Render coverage table
        if: github.event_name == 'pull_request' && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-comment.mjs coverage/coverage-summary.json "$RUNNER_TEMP/baseline/coverage-summary.json" > "$RUNNER_TEMP/coverage-comment.md"
      - name: Upsert one coverage comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coverage/coverage-summary.json') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.RUNNER_TEMP + '/coverage-comment.md', 'utf8');
            const marker = '<!-- herdr-coverage-report -->';
            const issue_number = context.issue.number;
            const {owner, repo} = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const old = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({owner, repo, comment_id: old.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      # No Vite+ task cache: every run rebuilds; timings are written to the job summary.
      - name: Pack TypeScript to JavaScript (vp pack)
        run: |
          start=$SECONDS
          npm run pack:ts
          echo "- vp pack: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify generated Orca UI and shared helpers
        run: ./node_modules/.bin/vpx src/tooling/build-orca-ui.ts --check --out .
      - name: Build delivery
        run: |
          start=$SECONDS
          npm run pack:delivery
          echo "- pack:delivery: $((SECONDS-start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify delivery
        run: ./node_modules/.bin/vpx src/tooling/verify-output.ts --delivery
      - name: Package one artifact with a manifest
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          cd tools/vite-plus-pilot/dist/delivery
          zip -qr "$GITHUB_WORKSPACE/herdr-my-orca.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum herdr-my-orca.zip > herdr-my-orca.zip.sha256
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess
          zip_sha = hashlib.sha256(open("herdr-my-orca.zip", "rb").read()).hexdigest()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          manifest = {"schema": 1, "commit": commit, "pr_head_sha": os.environ["PR_HEAD_SHA"] or None,
                      "base_ref": os.environ["BASE_REF"] or None, "zip": "herdr-my-orca.zip", "zip_sha256": zip_sha}
          json.dump(manifest, open("manifest.json", "w"), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-delivery-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            herdr-my-orca.zip
            herdr-my-orca.zip.sha256
            manifest.json
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI
    needs: [check, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed (no fail-fast)
        env:
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          test "$CHECK" = success
          test "$TEST" = success
          test "$BUILD" = success

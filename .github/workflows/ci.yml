name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Config and syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      - name: Check Python and shell availability
        run: |
          python3 --version
          bash --version | head -n 1
      - name: Validate configuration and mod manifests
        run: node scripts/check-config.mjs
      - name: Pack TypeScript outputs
        run: npm run pack:ts
      - name: Check generated Orca UI and shared helpers
        run: ./node_modules/.bin/vpx src/tooling/build-orca-ui.ts --check --out .
      - name: Run UI snapshot observer unit tests (no GUI)
        run: python3 -m unittest discover -s ui-snapshot -p 'test_*.py'
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code

  tests:
    name: Node flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated herdr-app test stand-in
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$#" -eq 2 ] && [ "$1" = do ] && [ "$2" = orca-status-bar.refresh ]; then echo "$@" >> "$RUNNER_TEMP/stub.log"; exit 0; fi\nexit 1\n' > "$RUNNER_TEMP/bin/herdr-app"
          chmod +x "$RUNNER_TEMP/bin/herdr-app"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run Node flow tests
        shell: bash
        run: |
          export HOME="$(mktemp -d)" HERDR_APP_HOME="$(mktemp -d)"
          selected="$(find mods \( -name '*.test.js' -o -name '*.test.mjs' \) | sort)"
          test -n "$selected"
          node --test --test-timeout=60000 $selected
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code

  typescript:
    name: TypeScript checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install isolated herdr-app test stand-in
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nif [ "$#" -eq 2 ] && [ "$1" = do ] && [ "$2" = orca-status-bar.refresh ]; then echo "$@" >> "$RUNNER_TEMP/stub.log"; exit 0; fi\nexit 1\n' > "$RUNNER_TEMP/bin/herdr-app"
          chmod +x "$RUNNER_TEMP/bin/herdr-app"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-aware lint and type check
        run: npm run check:ts
      - name: Pack TypeScript outputs
        run: npm run pack:ts
      - name: Vitest suite
        run: |
          export HOME="$(mktemp -d)" HERDR_APP_HOME="$(mktemp -d)"
          npm run test:ts
      - name: Ensure tests did not modify tracked files
        run: git diff --exit-code

  checks:
    name: Tests and config validation
    needs: [validate, tests, typescript]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all suites and validation
        env:
          VALIDATION: ${{ needs.validate.result }}
          TESTS: ${{ needs.tests.result }}
          TYPESCRIPT: ${{ needs.typescript.result }}
        run: |
          test "$VALIDATION" = success
          test "$TESTS" = success
          test "$TYPESCRIPT" = success

  delivery:
    name: Build validated delivery
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      - name: Build and verify delivery
        run: |
          npm run pack:delivery
          ./node_modules/.bin/vpx src/tooling/verify-output.ts --delivery
      - name: Package delivery artifact
        run: |
          cd tools/vite-plus-pilot/dist/delivery
          zip -qr "$GITHUB_WORKSPACE/herdr-my-orca.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum herdr-my-orca.zip > herdr-my-orca.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-delivery-${{ github.sha }}
          path: |
            herdr-my-orca.zip
            herdr-my-orca.zip.sha256
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package validated config
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdr-delivery-${{ github.sha }}
      - name: Publish the validated artifact
        run: |
          sha256sum -c herdr-my-orca.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-my-orca-${{ github.sha }}
          path: |
            herdr-my-orca.zip
            herdr-my-orca.zip.sha256
          if-no-files-found: error
          retention-days: 14

  native:
    name: Herdr native mod check (isolated)
    if: github.event_name == 'pull_request' && github.base_ref == 'ci/main-with-full-process'
    needs: delivery
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: herdr-delivery-${{ github.sha }}
      - name: Verify delivery checksum
        run: shasum -a 256 -c herdr-my-orca.zip.sha256
      - name: Install upstream Herdr app
        run: |
          test "$(uname -m)" = arm64
          curl --fail --silent --show-error --location --retry 3 https://releases.herdr.dev/app/install.sh -o "$RUNNER_TEMP/herdr-install.sh"
          sh "$RUNNER_TEMP/herdr-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the delivered mods in an isolated Herdr app home
        shell: bash
        run: |
          export HERDR_APP_HOME="$RUNNER_TEMP/herdr-ci-home"
          mkdir -p "$HERDR_APP_HOME"
          unzip -q herdr-my-orca.zip -d "$HERDR_APP_HOME"
          cd "$HERDR_APP_HOME"
          test "$(find mods -mindepth 2 -maxdepth 2 -name mod.json | wc -l | tr -d ' ')" -gt 0
          failed=0
          while IFS= read -r name; do
            mod="$HERDR_APP_HOME/mods/$name"
            test -f "$mod/mod.json" || exit 1
            echo "::group::${mod##*/}"
            if ! herdr-app check "$mod"; then
              echo "::error::Native check failed for ${mod##*/}"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find mods -mindepth 2 -maxdepth 2 -name mod.json -print | sort | sed 's|^mods/||;s|/mod.json$||')
          exit "$failed"

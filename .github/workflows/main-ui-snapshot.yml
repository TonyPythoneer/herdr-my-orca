# Canonical launcher. The CI branch keeps only this stable entrypoint.
# All implementation and scripts are read from main.
name: Main UI snapshot
on:
  push:
    branches: [ci/main-ui-snapshot]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-ui-snapshot
  cancel-in-progress: true
jobs:
  observe:
    if: github.ref == 'refs/heads/ci/main-ui-snapshot'
    uses: TonyPythoneer/herdr-my-orca/.github/workflows/main-ui-snapshot-reusable.yml@main

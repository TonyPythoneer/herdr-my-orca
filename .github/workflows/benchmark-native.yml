name: Native page benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/benchmark-*.py'
      - 'scripts/benchmark-*.mjs'
      - 'scripts/benchmark-*.test.js'
      - 'mods/**'
      - 'layouts/**'
      - 'themes/**'
      - 'shared/**'
      - 'settings.json'
      - 'programs.json'
      - 'keys.json'
      - '.github/workflows/benchmark-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Native ${{ matrix.layout }} / ${{ matrix.stack }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        layout: [orca, orca-unified]
        stack: [main, panel-body]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Herdr and screenshot dependency
        run: |
          test "$(uname -m)" = arm64
          curl --fail --silent --show-error --location --retry 3 https://releases.herdr.dev/app/install.sh -o "$RUNNER_TEMP/herdr-install.sh"
          sh "$RUNNER_TEMP/herdr-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip install Pillow
      - name: Collect same-session provisional page measurements
        id: capture
        run: |
          herdr-app --version
          hc --version
          python scripts/benchmark-pages.py --candidate-baseline --layout "${{ matrix.layout }}" --stack "${{ matrix.stack }}" --samples 30 --settle 0.5 --idle-seconds 3 --output "$RUNNER_TEMP/native-benchmark"
      - name: Validate provisional report and evidence
        id: validate
        if: always()
        env:
          BENCH_STACK: ${{ matrix.stack }}
          BENCH_LAYOUT: ${{ matrix.layout }}
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "native-benchmark"
          report = json.loads((p / "report.json").read_text())
          approvals = json.loads((p / "approved.json").read_text())
          assert report["mode"] == "candidate_baseline"
          for row in report["pages"]:
              key = row["layout"] + "--" + row["page"]
              if row["status"] == "not_measured":
                  assert row["page"] == "ports", row
                  continue
              if key in approvals:
                  assert approvals[key]["approved"] is False
                  assert (p / approvals[key]["image"]).is_file()
              if row["status"] == "provisional_measured":
                  assert row["warm"]["matched"] == 30, row
                  assert (p / (key + "--before.png")).is_file()
                  assert (p / (key + "--after.png")).is_file()
              print(key, row["status"], row.get("warm", {}).get("metrics", {}).get("reference_match_ms", {}))
          plan = runpy.run_path("scripts/benchmark-pages.py")["plan"]()
          expected = {r["page"] for r in plan if r["layout"] == os.environ["BENCH_LAYOUT"] and r["stack"] == os.environ["BENCH_STACK"]}
          actual = [r["page"] for r in report["pages"]]
          assert len(actual) == len(expected) and set(actual) == expected, (actual, expected, report.get("fatal_error"))
          assert all(r["status"] == ("not_measured" if r["page"] == "ports" else "provisional_measured") for r in report["pages"]), [(r["page"],r["status"],r.get("reason")) for r in report["pages"]]
          PY
      - name: Collect one targeted diagnostic pass
        id: diagnostic
        if: always() && !cancelled()
        continue-on-error: true
        run: |
          root="$RUNNER_TEMP/native-benchmark"
          if [ ! -f "$root/report.json" ]; then
            echo "No primary report; diagnostic cannot be selected"
            exit 0
          fi
          page="$(python scripts/benchmark-report.py --select-diagnostic "$root/report.json")"
          if [ -z "$page" ]; then
            echo "No eligible diagnostic route"
            exit 0
          fi
          python scripts/benchmark-pages.py --candidate-baseline --diagnostic --layout "${{ matrix.layout }}" --stack "${{ matrix.stack }}" --page "$page" --samples 5 --settle 0.5 --idle-seconds 3 --output "$root/diagnostic"
      - name: Record runner outcomes even when measurement fails
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-benchmark"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "native-benchmark" / "runner.json"
          p.write_text(json.dumps({
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "capture": os.environ["CAPTURE_OUTCOME"],
              "validate": os.environ["VALIDATE_OUTCOME"],
              "diagnostic": os.environ["DIAGNOSTIC_OUTCOME"],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-benchmark-${{ matrix.layout }}-${{ matrix.stack }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-benchmark/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  feedback:
    name: AI benchmark feedback
    needs: capture
    if: always() && !cancelled() && needs.capture.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: native-benchmark-*-${{ github.sha }}
          path: ${{ runner.temp }}/benchmark-input
          merge-multiple: false
      - name: Aggregate evidence and prioritize next iteration
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MATRIX_RESULT: ${{ needs.capture.result }}
        run: |
          python3 scripts/benchmark-report.py \
            --input "$RUNNER_TEMP/benchmark-input" \
            --output "$RUNNER_TEMP/ai-benchmark-report" \
            --commit "$GITHUB_SHA" --head "$PR_HEAD" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --matrix-result "$MATRIX_RESULT"
          cat "$RUNNER_TEMP/ai-benchmark-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: report
        with:
          name: ai-benchmark-report
          path: ${{ runner.temp }}/ai-benchmark-report/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Upsert one benchmark comment on the current PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/ai-benchmark-report/report.md
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- herdr-native-benchmark-report:v1 -->';
            const number = context.payload.pull_request.number;
            const {owner, repo} = context.repo;
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (current.state !== 'open' || current.head.sha !== context.payload.pull_request.head.sha) {
              core.notice('Skipping stale or closed PR feedback.');
              return;
            }
            const body = fs.readFileSync(process.env.REPORT_FILE, 'utf8')
              + '\n[Download AI benchmark report artifact](' + process.env.ARTIFACT_URL + ')\n';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100
            });
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: number, body});
            }
      - name: Require complete primary evidence (not performance thresholds)
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "ai-benchmark-report" / "ai-report.json"
          report = json.loads(p.read_text())
          assert report["status"] == "complete_provisional", report["coverage"]
          PY

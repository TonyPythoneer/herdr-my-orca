name: Vite+ migration candidate
on:
  push:
    branches: [refactor/vite-plus-migration]
  pull_request:
    branches: [fix/sidebar-branch-tooltip]
    paths:
      - 'tools/vite-plus-pilot/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'mods/**'
      - 'orca-ui/**'
      - '.github/workflows/vite-plus-candidate.yml'
      - 'orca-ui/shared/list-viewport.js'
      - 'orca-ui/shared/manifest.json'
      - 'eslint.config.mjs'
permissions:
  contents: read
concurrency:
  group: vite-plus-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen toolchain
        run: npm ci --no-audit --no-fund
      - name: Verify type-aware lint and type checking
        run: |
          npm run check:pilot
          node tools/vite-plus-pilot/verify-type-check.mjs
      - name: Run Vite+ tests
        run: npm run test:pilot
      - name: Pack and compare actual JS output
        run: |
          npm run pack:pilot
          node tools/vite-plus-pilot/verify-output.mjs
      - name: Compare lint diagnostics
        if: matrix.os == 'ubuntu-latest'
        run: npm run compare:lint
      - name: Build full isolated installation candidate
        if: always() && !cancelled()
        run: npm run pack:delivery:candidate
      - name: Verify no tracked production files changed
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vite-plus-candidate-${{ matrix.os }}
          path: |
            tools/vite-plus-pilot/dist/
            package-lock.json

name: Vite+ migration candidate
on:
  push:
    branches: [refactor/vite-plus-migration]
  pull_request:
    branches: [fix/sidebar-branch-tooltip]
    paths:
      - 'tools/vite-plus-pilot/**'
      - '.github/workflows/vite-plus-candidate.yml'
      - 'orca-ui/shared/list-viewport.js'
      - 'orca-ui/shared/manifest.json'
      - 'eslint.config.mjs'
permissions:
  contents: read
concurrency:
  group: vite-plus-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/vite-plus-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve pinned candidate (lockfile captured for review)
        run: npm install --no-audit --no-fund
      - name: Verify type-aware lint and type checking
        run: |
          npm run check
          node verify-type-check.mjs
      - name: Run Vite+ tests
        run: npm run test
      - name: Pack and compare actual JS output
        run: |
          npm run pack
          npm run parity
      - name: Compare lint diagnostics
        if: matrix.os == 'ubuntu-latest'
        run: node compare-lint.mjs
      - name: Verify no tracked production files changed
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vite-plus-candidate-${{ matrix.os }}
          path: |
            tools/vite-plus-pilot/dist/
            tools/vite-plus-pilot/package-lock.json

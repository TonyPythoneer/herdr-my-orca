name: LiteLLM local gateway E2E
on:
  pull_request:
    paths:
      - 'mods/orca-agent-flyout/**'
      - 'mods/orca-agent-settings/**'
      - 'mods/orca-status-bar/**'
      - 'orca-ui/shared/agent-config-view.js'
      - 'scripts/litellm-gateway-e2e.py'
      - '.github/workflows/litellm-gateway-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-e2e:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned LiteLLM locally
        run: |
          python -m venv "$RUNNER_TEMP/gateway-venv"
          "$RUNNER_TEMP/gateway-venv/bin/pip" install 'litellm[proxy]==1.111.0'
      - name: Real gateway E2E against loopback mock
        run: '"$RUNNER_TEMP/gateway-venv/bin/python" scripts/litellm-gateway-e2e.py'

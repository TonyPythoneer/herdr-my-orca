name: Native UI snapshot acceptance
on:
  pull_request:
    branches: [ci/main-with-full-process]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: native-ui-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    uses: ./.github/workflows/main-ui-snapshot-reusable.yml
